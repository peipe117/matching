        /* --- 3D 相容性修復 --- */
        .perspective-1000 { 
            perspective: 1000px;

        }
        .transform-style-3d { 
            transform-style: preserve-3d; 
            -webkit-transform-style: preserve-3d; 
        }
        .backface-hidden { 
            -webkit-backface-visibility: hidden; 
            backface-visibility: hidden;
        }
        .rotate-y-180 { 
            transform: rotateY(180deg);
            -webkit-transform: rotateY(180deg);
        }
        .card-face {
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 1.4rem;
            transform: translateZ(1px); 
            transition: box-shadow 0.3s ease;
        }
        .card-face-back { transform: rotateY(0deg) translateZ(1px); }
        .card-face-front { transform: rotateY(180deg) translateZ(1px); }
        
        /* 錯誤時的震動動畫 */
        @keyframes shake {
            0%, 100% { transform: translateX(0) rotateY(180deg); }
            20%, 60% { transform: translateX(-5px) rotateY(180deg); }
            40%, 80% { transform: translateX(5px) rotateY(180deg); }
        }
        .animate-shake .card-face-front {
            animation: shake 0.4s ease-in-out;
            border-color: #fca5a5; /* 震動時邊框變紅 */
            border-width: 4px;
        }

        // 音效管理器 (Web Audio API)
        const soundManager = {
            ctx: null,
            init: function() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            },
            play: function(type) {
                if (!this.ctx) this.init();
                if (this.ctx.state === 'suspended') this.ctx.resume();

                const t = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                
                osc.connect(gain);
                gain.connect(this.ctx.destination);

                if (type === 'flip') {
                    // 翻牌音效：短促的木魚聲
                    osc.frequency.setValueAtTime(400, t);
                    osc.frequency.exponentialRampToValueAtTime(600, t + 0.1);
                    gain.gain.setValueAtTime(0.1, t);
                    gain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
                    osc.start(t);
                    osc.stop(t + 0.1);
                } else if (type === 'match') {
                    // 配對成功：悅耳的和弦
                    const playNote = (freq, delay) => {
                        const o = this.ctx.createOscillator();
                        const g = this.ctx.createGain();
                        o.connect(g);
                        g.connect(this.ctx.destination);
                        o.frequency.value = freq;
                        g.gain.setValueAtTime(0, t + delay);
                        g.gain.linearRampToValueAtTime(0.1, t + delay + 0.05);
                        g.gain.exponentialRampToValueAtTime(0.001, t + delay + 0.5);
                        o.start(t + delay);
                        o.stop(t + delay + 0.5);
                    };
                    playNote(523.25, 0);   // Do
                    playNote(659.25, 0.1); // Mi
                    playNote(783.99, 0.2); // Sol
                } else if (type === 'wrong') {
                    // 配對失敗：低沉的提示
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(150, t);
                    osc.frequency.linearRampToValueAtTime(100, t + 0.2);
                    gain.gain.setValueAtTime(0.1, t);
                    gain.gain.linearRampToValueAtTime(0, t + 0.2);
                    osc.start(t);
                    osc.stop(t + 0.2);
                } else if (type === 'win') {
                    // 勝利音效：連續的歡呼感
                    const playWinNote = (freq, delay) => {
                        const o = this.ctx.createOscillator();
                        const g = this.ctx.createGain();
                        o.type = 'triangle';
                        o.connect(g);
                        g.connect(this.ctx.destination);
                        o.frequency.value = freq;
                        g.gain.setValueAtTime(0, t + delay);
                        g.gain.linearRampToValueAtTime(0.2, t + delay + 0.1);
                        g.gain.exponentialRampToValueAtTime(0.001, t + delay + 0.8);
                        o.start(t + delay);
                        o.stop(t + delay + 0.8);
                    };
                    playWinNote(523.25, 0);
                    playWinNote(659.25, 0.15);
                    playWinNote(783.99, 0.3);
                    playWinNote(1046.50, 0.45); // High Do
                }
            }
        };

                    </div>
                </div>
            );
        };

        const PrintLayout = ({ lesson }) => {
            const parsedWords = parseLessonWords(String(lesson.words || ""));
            const printCards = [];
            parsedWords.forEach((item) => {
                const { char, customPinyin } = item;
                printCards.push({ type: 'text', content: char });
                let pinyinContent;
                if (customPinyin) {
                    pinyinContent = customPinyin;
                } else {
                    const info = PINYIN_MAP[char] || { z: char, p: '' };
                    pinyinContent = info.p ? `${info.z} /${info.p}/` : info.z;
                }
                printCards.push({ type: 'pinyin', content: pinyinContent });
            });

            return (
                <div className="w-full">
                    <div className="text-center mb-6">
                        <h1 className="text-3xl font-black text-slate-800 mb-2">{lesson.name} - 生字卡</h1>
                        <p className="text-slate-500">共 {parsedWords.length} 個生字，{printCards.length} 張卡牌</p>
                    </div>
                    <div className="grid grid-cols-4 gap-4">
                        {printCards.map((card, idx) => (
                            <div key={idx} className="aspect-[3/4] border-2 border-dashed border-slate-300 rounded-xl flex items-center justify-center p-4 break-inside-avoid relative">
                                {card.type === 'text' ? (
                                    <span className="text-5xl font-black text-slate-800">{card.content}</span>
                                ) : (
                                    <span className="text-xl font-bold text-slate-700 text-center leading-relaxed">{card.content}</span>
                                )}
                                {/* 移除小剪刀圖案 */}
                            </div>
                        ))}
                    </div>
                    <div className="mt-8 text-center text-sm text-slate-400 border-t pt-4">
                        Sophia Wong 修訂 | 生字翻翻樂教具
                    </div>
                </div>
            );
        };

        const InstallGuideModal = ({ onClose }) => {
            const [os, setOs] = useState('unknown');
            useEffect(() => {
                const userAgent = navigator.userAgent || navigator.vendor || window.opera;
                if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
                    setOs('ios');
                } else if (/android/i.test(userAgent)) {
                    setOs('android');
                } else {
                    setOs('desktop');
                }
            }, []);

            return (
                <div className="fixed inset-0 z-[60] flex items-end md:items-center justify-center p-4 bg-slate-900/80 backdrop-blur-sm animate-fade-in no-print" onClick={onClose}>
                    <div className="bg-white w-full max-w-sm rounded-t-3xl md:rounded-3xl p-6 shadow-2xl relative animate-pop-in" onClick={e => e.stopPropagation()}>
                        <button onClick={onClose} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600">
                            <Icon name="x" className="w-6 h-6" />
                        </button>
                        <div className="flex items-center gap-3 mb-4">
                            <div className="bg-sky-100 p-3 rounded-2xl">
                                <Icon name="smartphone" className="w-6 h-6 text-sky-600" />
                            </div>
                            <h3 className="text-xl font-bold text-slate-800">如何加入主畫面？</h3>
                        </div>
                        <div className="text-slate-600 text-sm leading-relaxed mb-6">
                            將這個遊戲變成 App，隨時都能玩！
                        </div>
                        {os === 'ios' && (
                            <div className="space-y-4">
                                <div className="flex items-start gap-3 bg-slate-50 p-3 rounded-xl border border-slate-100">
                                    <div className="bg-white p-2 rounded-lg shadow-sm shrink-0"><Icon name="share" className="w-5 h-5 text-blue-500" /></div>
                                    <div><p className="font-bold text-slate-700 text-sm">1. 點擊分享按鈕</p><p className="text-xs text-slate-500 mt-1">通常在瀏覽器下方工具列</p></div>
                                </div>
                                <div className="flex items-start gap-3 bg-slate-50 p-3 rounded-xl border border-slate-100">
                                    <div className="bg-white p-2 rounded-lg shadow-sm shrink-0"><Icon name="plus-square" className="w-5 h-5 text-slate-700" /></div>
                                    <div><p className="font-bold text-slate-700 text-sm">2. 選擇「加入主畫面」</p><p className="text-xs text-slate-500 mt-1">往下滑動選單可以找到</p></div>
                                </div>
                            </div>
                        )}
                        {os === 'android' && (
                            <div className="space-y-4">
                                <div className="flex items-start gap-3 bg-slate-50 p-3 rounded-xl border border-slate-100">
                                    <div className="bg-white p-2 rounded-lg shadow-sm shrink-0"><Icon name="more-vertical" className="w-5 h-5 text-slate-700" /></div>
                                    <div><p className="font-bold text-slate-700 text-sm">1. 點擊選單圖示</p><p className="text-xs text-slate-500 mt-1">位於瀏覽器右上角</p></div>
                                </div>
                                <div className="flex items-start gap-3 bg-slate-50 p-3 rounded-xl border border-slate-100">
                                    <div className="bg-white p-2 rounded-lg shadow-sm shrink-0"><Icon name="download" className="w-5 h-5 text-sky-600" /></div>
                                    <div><p className="font-bold text-slate-700 text-sm">2. 選擇「安裝應用程式」</p><p className="text-xs text-slate-500 mt-1">或是「加入主畫面」</p></div>
                                </div>
                            </div>
                        )}
                        {os === 'desktop' && (
                            <div className="text-center py-4 bg-slate-50 rounded-xl border border-slate-100">
                                <p className="text-slate-600 font-medium">請使用 <span className="font-bold text-sky-600">Ctrl + D</span> 加入書籤</p>
                            </div>
                        )}
                        <button onClick={onClose} className="w-full mt-6 bg-slate-800 text-white font-bold py-3 rounded-xl active:scale-95 transition-transform">我知道了</button>
                    </div>
                </div>
            );
        };

        function App() {
            const [lessons, setLessons] = useState(DEFAULT_LESSONS);
            const [currentLessonId, setCurrentLessonId] = useState(1);
            const [cards, setCards] = useState([]);
            const [flippedCards, setFlippedCards] = useState([]);
            const [matchedIds, setMatchedIds] = useState([]);
            const [isDisabled, setIsDisabled] = useState(false);
            const [moves, setMoves] = useState(0);
            const [gameWon, setGameWon] = useState(false);
            const [showInstallModal, setShowInstallModal] = useState(false);
            const [showCustomModal, setShowCustomModal] = useState(false);
            const [showDeleteModal, setShowDeleteModal] = useState(false);
            const [editingLesson, setEditingLesson] = useState(null);
            const [currentPattern, setCurrentPattern] = useState('pattern-large-dots'); 
            const [shakingCard, setShakingCard] = useState(null); // 新增：控制震動的卡片

            useEffect(() => {
                if (document.getElementById('busuanzi-script')) return;
                const script = document.createElement('script');
                script.id = 'busuanzi-script';
                script.src = "https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js";
                script.async = true;
                document.body.appendChild(script);
            }, []);

            useEffect(() => {
                const savedLessons = localStorage.getItem('custom_lessons');
                if (savedLessons) {
                    const parsed = JSON.parse(savedLessons);
                    setLessons([...DEFAULT_LESSONS, ...parsed]);
                }
            }, []);

            useEffect(() => {
                initializeGame();
            }, [currentLessonId, lessons]);

            const handleSaveCustomLesson = (id, name, words) => {
                let newLessons;
                if (id) {
                    newLessons = lessons.map(l => l.id === id ? { ...l, name, words } : l);
                } else {
                    const newId = Date.now();
                    const newLesson = { id: newId, name: name, words: words, isCustom: true };
                    newLessons = [...lessons, newLesson];
                    setCurrentLessonId(newId);
                }
                setLessons(newLessons);
                const customOnly = newLessons.filter(l => l.isCustom);
                localStorage.setItem('custom_lessons', JSON.stringify(customOnly));
            };

            const handleDeleteClick = (e) => {
                e.stopPropagation();
                setShowDeleteModal(true);
            };

            const performDelete = () => {
                const lessonId = currentLessonId;
                const newLessons = lessons.filter(l => l.id !== lessonId);
                setLessons(newLessons);
                setCurrentLessonId(1);
                const customOnly = newLessons.filter(l => l.isCustom);
                localStorage.setItem('custom_lessons', JSON.stringify(customOnly));
                setShowDeleteModal(false);
            };

            const generateCards = (lessonId) => {
                const lesson = lessons.find(l => l.id === lessonId) || lessons[0];
                const parsedWords = parseLessonWords(String(lesson.words || ""));
                const cardData = [];
                parsedWords.forEach((item, index) => {
                    const { char, customPinyin } = item;
                    const color = COLORS[index % COLORS.length];
                    cardData.push({ id: `char-${char}-${index}`, matchId: index, type: 'text', content: char, color: color });
                    let pinyinContent;
                    if (customPinyin) {
                        pinyinContent = customPinyin;
                    } else {
                        const info = PINYIN_MAP[char] || { z: char, p: '' };
                        pinyinContent = info.p ? `${info.z} /${info.p}/` : info.z;
                    }
                    cardData.push({ 
                        id: `pinyin-${char}-${index}`, 
                        matchId: index, 
                        type: 'image',
                        content: pinyinContent, 
                        color: color.replace('100', '200') 
                    });
                });
                return cardData;
            };

            const shuffleArray = (array) => {
                const shuffled = [...array];
                for (let i = shuffled.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
                }
                return shuffled.map(card => ({ ...card, uniqueId: Math.random().toString(36).substr(2, 9) }));
            };

            const initializeGame = () => {
                const randomPattern = PATTERNS[Math.floor(Math.random() * PATTERNS.length)];
                setCurrentPattern(randomPattern);
                const rawCards = generateCards(currentLessonId);
                setCards(shuffleArray(rawCards));
                setFlippedCards([]);
                setMatchedIds([]);
                setMoves(0);
                setGameWon(false);
                setIsDisabled(false);
                setTimeout(() => lucide.createIcons(), 100);
            };

            const handleCardClick = (uniqueId, matchId) => {
                if (isDisabled || flippedCards.some(card => card.uniqueId === uniqueId) || matchedIds.includes(matchId)) return;
                
                // 播放翻牌音效
                soundManager.play('flip');

                const newFlippedCards = [...flippedCards, { uniqueId, matchId }];
                setFlippedCards(newFlippedCards);

                if (newFlippedCards.length === 2) {
                    setIsDisabled(true);
                    setMoves(prev => prev + 1);
                    if (newFlippedCards[0].matchId === newFlippedCards[1].matchId) {
                        setMatchedIds(prev => {
                            const next = [...prev, matchId];
                            const currentLesson = lessons.find(l => l.id === currentLessonId) || lessons[0];
                            const parsedCount = parseLessonWords(String(currentLesson.words || "")).length;
                            
                            // 播放配對成功音效
                            soundManager.play('match');

                            if (next.length === parsedCount) {
                                setTimeout(() => {
                                    setGameWon(true);
                                    soundManager.play('win'); // 播放勝利音效
                                    confetti({
                                        particleCount: 150,
                                        spread: 70,
                                        origin: { y: 0.6 }
                                    });
                                }, 800);
                            }
                            return next;
                        });
                        setFlippedCards([]);
                        setIsDisabled(false);
                    } else {
                        // 配對失敗
                        setTimeout(() => {
                            soundManager.play('wrong'); // 播放錯誤音效
                            // 觸發震動
                            setShakingCard([newFlippedCards[0].uniqueId, newFlippedCards[1].uniqueId]);
                            setTimeout(() => setShakingCard(null), 500); // 移除震動
                            
                            setFlippedCards([]);
                            setIsDisabled(false);
                        }, 800);
                    }
                }
            };

            const handlePrint = () => {
                window.print();
            };

            const getGridConfig = (count) => {
                if (count === 16) return "grid-cols-2 md:grid-cols-4 max-w-4xl";
                if (count === 18) return "grid-cols-2 md:grid-cols-3 lg:grid-cols-6 max-w-6xl";
                if (count === 20) return "grid-cols-2 sm:grid-cols-4 lg:grid-cols-5 max-w-5xl";
                return "grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 max-w-5xl";
            };

            const gridClass = getGridConfig(cards.length);
            const isCurrentCustom = lessons.find(l => l.id === currentLessonId)?.isCustom;

            return (
                <div className="min-h-screen font-sans selection:bg-sky-200">
                    <div className="hidden print-only">
                        <PrintLayout lesson={lessons.find(l => l.id === currentLessonId) || lessons[0]} />
                    </div>

                    <div className="flex flex-col items-center py-6 md:py-12 px-2 md:px-4 overflow-x-hidden pb-24 no-print">
                        <div className="w-full max-w-5xl mb-8 flex flex-col items-center">
                            <div className="flex items-center gap-3 mb-4 bg-sky-100 px-4 py-1.5 rounded-full">
                               <Icon name="book-open" className="w-4 h-4 text-sky-600" />
                               <span className="text-sky-700 font-bold text-sm tracking-widest uppercase">學華語向前走 第二冊</span>
                            </div>
                            <h1 className="text-4xl md:text-6xl font-black text-slate-800 mb-4 drop-shadow-sm">生字翻翻樂</h1>
                        </div>

                        <div className="w-full max-w-4xl bg-white p-4 md:p-6 rounded-3xl shadow-xl border border-slate-100 flex flex-col md:flex-row items-center md:items-end gap-4 md:gap-6 mb-10 transition-all">
                            <div className="flex-1 w-full">
                                <label className="block text-xs font-bold text-slate-400 uppercase tracking-tighter mb-2 ml-1">選擇課程</label>
                                <div className="flex gap-2">
                                    <div className="relative group flex-1">
                                        <select 
                                            value={currentLessonId}
                                            onChange={(e) => setCurrentLessonId(Number(e.target.value))}
                                            className="w-full appearance-none bg-slate-50 border-2 border-slate-100 text-slate-700 font-bold py-3.5 px-6 pr-12 rounded-2xl focus:outline-none focus:ring-4 focus:ring-sky-100 focus:border-sky-300 cursor-pointer transition-all text-lg"
                                        >
                                            {lessons.map(lesson => (
                                                <option key={lesson.id} value={lesson.id}>
                                                    {lesson.name} {lesson.isCustom ? '(自訂)' : ''}
                                                </option>
                                            ))}
                                        </select>
                                        <Icon name="chevron-down" className="absolute right-4 top-1/2 -translate-y-1/2 w-6 h-6 text-slate-400 pointer-events-none" />
                                    </div>
                                    <button onClick={() => { setEditingLesson(null); setShowCustomModal(true); }} className="bg-sky-100 hover:bg-sky-200 text-sky-600 p-3.5 rounded-2xl transition-colors active:scale-95" title="新增自訂課程"><Icon name="plus" className="w-6 h-6" /></button>
                                    {isCurrentCustom && (
                                        <>
                                            <button onClick={() => { setEditingLesson(lessons.find(l => l.id === currentLessonId)); setShowCustomModal(true); }} className="bg-orange-50 hover:bg-orange-100 text-orange-500 p-3.5 rounded-2xl transition-colors active:scale-95" title="修改此課程"><Icon name="pencil" className="w-6 h-6" /></button>
                                            <button onClick={handleDeleteClick} className="bg-red-50 hover:bg-red-100 text-red-500 p-3.5 rounded-2xl transition-colors active:scale-95" title="刪除此課程"><Icon name="trash-2" className="w-6 h-6" /></button>
                                        </>
                                    )}
                                </div>
                            </div>
                            <div className="flex items-center gap-4 pt-4 md:pt-0 w-full md:w-auto justify-between md:justify-start">
                                <div className="bg-slate-50 px-6 py-3 rounded-2xl flex items-center gap-4 border border-slate-100 flex-1 md:flex-none justify-center">
                                    <div className="flex items-center gap-2">
                                        <Icon name="refresh-cw" className="w-5 h-5 text-sky-500" />
                                        <span className="text-slate-500 font-bold">步數</span>
                                        <span className="text-2xl font-black text-slate-800 tabular-nums">{moves}</span>
                                    </div>
                                </div>
                                <button onClick={() => initializeGame()} className="bg-slate-800 hover:bg-slate-900 text-white px-8 py-3.5 rounded-2xl font-black transition-all shadow-lg active:scale-95 whitespace-nowrap">重洗牌</button>
                            </div>
                        </div>

                        <div className={`grid ${gridClass} gap-3 md:gap-4 w-full flex-grow place-items-center transition-all duration-500`}>
                            {cards.map((card) => {
                                const isFlipped = flippedCards.some(f => f.uniqueId === card.uniqueId);
                                const isMatched = matchedIds.includes(card.matchId);
                                const isShaking = shakingCard && shakingCard.includes(card.uniqueId);
                                
                                return (
                                    <div key={card.uniqueId} className={`relative w-full h-32 md:h-44 cursor-pointer perspective-1000 transition-all duration-700 ${isMatched ? 'opacity-0 pointer-events-none scale-0 rotate-12' : 'opacity-100 scale-100'} ${isShaking ? 'animate-shake' : ''}`} onClick={() => handleCardClick(card.uniqueId, card.matchId)}>
                                        <div className={`w-full h-full transition-transform duration-500 transform-style-3d relative rounded-3xl shadow-lg border-2 border-white ${isFlipped ? 'rotate-y-180' : ''}`}>
                                            <div className="card-face card-face-back bg-white flex items-center justify-center">
                                                <div className={`absolute inset-0 bg-slate-50 opacity-60 rounded-[1.4rem] ${currentPattern}`}></div>
                                                <div className="relative z-10 w-12 h-12 rounded-full bg-sky-50 flex items-center justify-center border-2 border-sky-100">
                                                    <span className="text-xl text-sky-300 font-black select-none">?</span>
                                                </div>
                                            </div>
                                            <div className={`card-face card-face-front flex items-center justify-center shadow-inner p-4 ${card.color}`}>
                                                {card.type === 'text' ? <span className="text-4xl md:text-5xl font-black text-slate-800 select-none">{card.content}</span> : <span className="text-xl md:text-2xl font-bold text-slate-700 text-center leading-relaxed select-none">{card.content}</span>}
                                            </div>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>

                        <footer className="mt-12 w-full max-w-md mx-auto no-print">
                            <div className="h-px bg-gradient-to-r from-transparent via-slate-200 to-transparent w-full mb-6"></div>
                            <div className="grid grid-cols-3 gap-4 mb-6">
                                <button onClick={handlePrint} className="flex flex-col items-center gap-2 group"><div className="w-12 h-12 bg-white border-2 border-slate-200 rounded-2xl flex items-center justify-center text-slate-400 group-hover:text-sky-500 group-hover:border-sky-200 group-hover:shadow-md transition-all"><Icon name="printer" className="w-6 h-6" /></div><span className="text-xs font-bold text-slate-400 group-hover:text-sky-600 transition-colors">列印/PDF</span></button>
                                <button onClick={() => setShowInstallModal(true)} className="flex flex-col items-center gap-2 group"><div className="w-12 h-12 bg-white border-2 border-slate-200 rounded-2xl flex items-center justify-center text-slate-400 group-hover:text-sky-500 group-hover:border-sky-200 group-hover:shadow-md transition-all"><Icon name="download" className="w-6 h-6" /></div><span className="text-xs font-bold text-slate-400 group-hover:text-sky-600 transition-colors">App</span></button>
                                <div className="flex flex-col items-center gap-2 group cursor-default"><div className="w-12 h-12 bg-white border-2 border-slate-200 rounded-2xl flex items-center justify-center text-slate-400"><Icon name="feather" className="w-6 h-6" /></div><span className="text-xs font-bold text-slate-400">Sophia Wong</span></div>
                            </div>
                            <div className="text-center text-xs text-slate-300 font-medium tracking-wide pb-4"><span id="busuanzi_container_site_uv">👀 訪客人數：<span id="busuanzi_value_site_uv" className="font-bold text-slate-400">...</span> 人</span></div>
                        </footer>

                        {gameWon && (
                            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-md animate-fade-in">
                                <div className="bg-white rounded-[2.5rem] p-10 max-w-md w-full text-center shadow-2xl border-b-8 border-yellow-400 transform animate-pop-in relative overflow-hidden">
                                    <div className="flex justify-center mb-6"><div className="bg-yellow-50 p-6 rounded-full relative"><Icon name="trophy" className="w-16 h-16 text-yellow-500 animate-bounce" /></div></div>
                                    <h2 className="text-4xl font-black text-slate-800 mb-2">挑戰成功！</h2>
                                    <p className="text-slate-500 mb-8 font-medium text-lg leading-relaxed">太厲害了！你完成了 <span className="text-sky-600 font-bold">{lessons.find(l => l.id === currentLessonId)?.name}</span><br/>總共只花了 <span className="text-slate-800 font-black">{moves}</span> 個步數。</p>
                                    <button onClick={() => initializeGame()} className="w-full bg-sky-500 hover:bg-sky-600 text-white text-xl font-black py-4 rounded-2xl shadow-xl shadow-sky-100 transition-all active:scale-95">繼續挑戰</button>
                                </div>
                            </div>
                        )}
                        
                        {showInstallModal && <InstallGuideModal onClose={() => setShowInstallModal(false)} />}
                        {showCustomModal && (<CustomLessonModal onClose={() => setShowCustomModal(false)} onSave={handleSaveCustomLesson} initialData={editingLesson}/>)}
                        {showDeleteModal && (<DeleteConfirmModal onClose={() => setShowDeleteModal(false)} onConfirm={performDelete} />)}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
